name: Version bump

on:
  push:
    branches: [main]
    paths:
      - "inferrex-x-ray/**"
      - "inferrex-redteam/**"
      - "inferrex-closure-check/**"
      - "compatibility/**"
      - "!**/VERSION"

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Bump changed skill versions
        shell: bash
        run: |
          set -euo pipefail
          compatibility_changed=false
          if git diff --name-only HEAD^ HEAD -- compatibility | grep -q .; then
            compatibility_changed=true
          fi
          for skill in inferrex-x-ray inferrex-redteam inferrex-closure-check; do
            if [[ "$compatibility_changed" == true ]] || git diff --name-only HEAD^ HEAD -- "$skill" \
              | grep -Ev "^${skill}/VERSION$" \
              | grep -q .; then
              current="$(tr -d '[:space:]' < "$skill/VERSION")"
              printf '%s\n' "$((current + 1))" > "$skill/VERSION"
            fi
          done

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inferrex-x-ray/VERSION inferrex-redteam/VERSION inferrex-closure-check/VERSION
          git diff --cached --quiet && exit 0
          git commit -m "bump: Inferrex review skill versions"
          git push
